# Host nginx site for the hosted box: terminates TLS and proxies everything to
# the `web` container on 127.0.0.1:8080 (FILSPAY_HTTP_PUBLISH in ops/.env).
# Install as /etc/nginx/sites-available/<host> with <host> replaced, link it
# into sites-enabled, then run certbot --nginx -d <host> once for the
# certificate lines. The host's own nginx.conf sets server_tokens off, gzip
# and the TLS session cache (certbot's options-ssl-nginx.conf).

# A pool of open connections to `web`, so a request does not pay for a new
# TCP connection. Reuse needs HTTP/1.1 and an empty Connection header, so the
# upgrade header is only sent when the client asked for a websocket.
upstream filspay_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $filspay_connection {
    default upgrade;
    ''      '';
}

server {
    server_name <host>;

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;

    location / {
        proxy_pass http://filspay_web;
        proxy_redirect http://$host/ https://$host/;
        # The app sets its own X-Frame-Options and X-Content-Type-Options;
        # hiding the copies stops a browser from seeing two conflicting values.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $filspay_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/<host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<host>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name <host>;
    return 301 https://$host$request_uri;
}
