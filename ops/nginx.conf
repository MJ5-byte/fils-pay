# Front door for the hosted box (the `web` service in ops/docker-compose.yml).
# One origin serves all three apps, so the api's host-only session cookies
# (fp_sid, fp_admin_sid, fp_impersonation) reach it from both front ends
# without CORS:
#   /v1/*, /healthz, /readyz      apps/api
#   /pay/*, /dashboard*           apps/web (merchant dashboard, checkout)
#   /web/*                        apps/web's built assets (built with base /web/)
#   everything else               apps/admin (/login, /merchants, ...)
# The two routers share no path, so neither app needs a basename.

# Re-resolve `api` through Docker's DNS, so a restarted api container with a
# new address is picked up without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream filspay_api {
    zone filspay_api 64k;
    server api:3000 resolve;
    keepalive 16;
}

# One shared counter of api requests in flight, with two caps. Past a cap
# the request is refused at once with 503, instead of queueing in the api
# until the client times out. Paying keeps headroom the other routes lack:
# once 20 requests are in flight a new checkout is turned away at the door,
# while a buyer who already opened one can still pay until 30. Measured on the
# 1 vCPU budget, checkouts top out near 30 a second at about 0.8 s each,
# so about 25 in flight; more only queues (see ops/README.md, "Hosted box").
limit_conn_zone $server_name zone=api_inflight:1m;

# Per-client request rates, keyed on the real client address (see the
# real_ip lines in the server block). Every api route gets a generous cap
# that only a flood from one address reaches; the login and OTP routes get a
# tight one on the three that send or check a code (login, verify, resend),
# so a code can't be guessed and a mailbox can't be flooded by brute force.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;
limit_conn_status 503;
limit_conn_log_level warn;

# The host nginx terminates TLS and sends X-Forwarded-Proto; keep its value
# so the api sees https, and fall back to this hop's scheme when run bare.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # KYC uploads go up to 8 MB (KYC_MAX_FILE_SIZE_BYTES).
    client_max_body_size 10m;

    # The host nginx (TLS) and Docker sit on private addresses; take the
    # client address from X-Forwarded-For past them, so the rate limits count
    # each client, not the host proxy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Proxy settings for every api location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 1s;
    # Settlement calls through the api can take up to 30 s
    # (SETTLEMENT_INTERNAL_REQUEST_TIMEOUT_MS).
    proxy_read_timeout 35s;
    proxy_next_upstream off;

    location ~ ^/v1/(auth|admin/auth)/(login|otp/verify|otp/resend)$ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        limit_conn api_inflight 20;
        proxy_pass http://filspay_api;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @api_unavailable;
    }

    location ~ ^/v1/payment-links/[^/]+/pay$ {
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_conn api_inflight 30;
        proxy_pass http://filspay_api;
        # Only a refusal at the door is safe to retry. A 502 or 504 can come
        # after the acquirer charged the card, so the payer is told to check
        # the link's status instead of paying again.
        error_page 429 = @rate_limited;
        error_page 503 = @api_unavailable;
        error_page 502 504 = @pay_outcome_unknown;
    }

    # Acquirer callbacks are not shed: a refused callback would rely on the
    # acquirer's retries to land a payment's final state.
    location = /v1/acquirer/callbacks {
        proxy_pass http://filspay_api;
        error_page 502 503 504 = @api_unavailable;
    }

    location /v1/ {
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_conn api_inflight 20;
        proxy_pass http://filspay_api;
        error_page 429 = @rate_limited;
        # A refusal (cap reached) or a down api (restarting) answers in the
        # api's own `{ error, message }` shape, so the front ends show it.
        error_page 502 503 504 = @api_unavailable;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://filspay_api;
        proxy_read_timeout 5s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"error":"rate_limited","message":"Too many requests, slow down and try again shortly."}';
    }

    location @pay_outcome_unknown {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        return 504 '{"error":"payment_outcome_unknown","message":"We could not confirm this payment. Check the payment link before trying again."}';
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"error":"service_unavailable","message":"FilsPay is busy, try again in a moment."}';
    }

    location = / {
        return 302 /dashboard;
    }

    location /web/ {
        alias /usr/share/nginx/web/;
    }

    location /pay/ {
        root /usr/share/nginx/web;
        try_files /index.html =404;
    }

    location /dashboard {
        root /usr/share/nginx/web;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/admin;
        try_files $uri /index.html;
    }
}
