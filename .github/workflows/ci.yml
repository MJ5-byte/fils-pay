name: CI

# Typecheck and the full test suites against a real, freshly migrated Postgres,
# the same way the repo's own `npm test` expects to run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filspay
          POSTGRES_PASSWORD: filspay
          POSTGRES_DB: filspay_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U filspay"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://filspay:filspay@localhost:5432/filspay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/settlement/go.mod
          cache-dependency-path: apps/settlement/go.sum
      - run: npm ci
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm test
      # gofmt is left out: main already carries unformatted files we must not
      # reformat outside their own fixes.
      - name: Go checks
        working-directory: apps/settlement
        run: |
          go vet ./...
          go test -count=1 -p 1 ./...
